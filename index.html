<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · Form Validation</title>
  <meta name="description" content="A sign-up form with live, accessible validation: email checks, a password strength meter, matching passwords and clear error messages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="card-head">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <h1 id="title">Create your account</h1>
        <p>It takes less than a minute. Fields are checked as you go.</p>
      </div>

      <form id="form" novalidate>
        <div class="field" data-field="name">
          <label for="name">Full name</label>
          <div class="control">
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Abiola Sikiru" aria-describedby="name-msg" required>
            <span class="state" aria-hidden="true"></span>
          </div>
          <p class="msg" id="name-msg"></p>
        </div>

        <div class="field" data-field="email">
          <label for="email">Email</label>
          <div class="control">
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-describedby="email-msg" required>
            <span class="state" aria-hidden="true"></span>
          </div>
          <p class="msg" id="email-msg"></p>
        </div>

        <div class="field" data-field="password">
          <label for="password">Password</label>
          <div class="control">
            <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-rules password-msg" required>
            <button type="button" class="reveal" data-reveal="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="meter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <ul class="rules" id="password-rules" aria-label="Password requirements">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="case">Upper and lower case letters</li>
            <li data-rule="number">A number</li>
            <li data-rule="symbol">A symbol, like ! or #</li>
          </ul>
          <p class="msg" id="password-msg" aria-live="polite"></p>
        </div>

        <div class="field" data-field="confirm">
          <label for="confirm">Confirm password</label>
          <div class="control">
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" aria-describedby="confirm-msg" required>
            <span class="state" aria-hidden="true"></span>
          </div>
          <p class="msg" id="confirm-msg"></p>
        </div>

        <div class="field check" data-field="terms">
          <label class="box">
            <input id="terms" name="terms" type="checkbox" aria-describedby="terms-msg">
            <span>I agree to the terms of service and privacy policy</span>
          </label>
          <p class="msg" id="terms-msg"></p>
        </div>

        <p class="summary" id="summary" role="alert" hidden></p>

        <button class="submit" type="submit">
          <span class="label">Create account</span>
          <span class="spin" aria-hidden="true"></span>
        </button>
      </form>

      <div class="done" id="done" hidden tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 10"/></svg>
        <h2>You're all set</h2>
        <p id="doneText"></p>
        <button class="ghost" id="again" type="button">Start over</button>
      </div>
    </section>
    <p class="foot">A front-end validation demo by Abiola. Nothing you type is sent anywhere.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
